<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href= stylemain.css>
    <meta charset="UTF-8">
    <title>TrakerFilm</title>
</head>
<body>
    <h1>TrakerFilm🎬</h1>
    <p>Отслеживай свои фильмы, сериалы и аниме</p>
    <div class="container">
        <div class="column">
            <h2>🍿 Планирую смотреть</h2>
            <p>Добавляй сюда фильмы которые хочешь посмореть :></p>
            <button onclick="Addf(1)">Перейти</button>
        </div>
        <div class="column">
            <h2>👀 Посмотрено</h2>
            <p>Отмечай сюда фильмы которые уже посмотрел ;></p>
            <button onclick="Addf(2)">Перейти</button>
        </div>
        <div class="column">
            <h2>⏳ Смотрю сейчас</h2>
            <p>Отмечай то что смотришь :></p>
            <button onclick="Addf(3)">Перейти</button>
        </div>
        <div class="column">
            <h2>❌ Брошено</h2>
            <p>Отмечай сюда фильмы которые ты бросил....</p>
            <button onclick="Addf(4)">Перейти</button>
        </div>
    </div>
<script src="script2.js"></script>
</body>
</html>
